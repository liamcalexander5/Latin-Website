<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roman Currency Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    /* ─────────────────────────────────────────────
       CONFIGURATION — EDIT YOUR VALUES HERE
       ─────────────────────────────────────────────
       Each era has:
         label        — displayed in the dropdown
         aureus_usd   — how many USD one aureus was worth (modern estimate)
         denarius_per_aureus — how many denarii in one aureus
         sestertius_per_denarius — how many sesterces in one denarius
         as_per_sestertius — how many asses in one sestertius
         description  — shown at the bottom; use {aureus}, {denarius}, {sestertius}, {as} as placeholders
    ─────────────────────────────────────────────── */

    /* The era data is defined in the <script> block at the bottom of this file */

    /* ─────────────────────────────────────────────
       THEME & LAYOUT
    ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:       #C9A84C;
      --gold-light: #E8D08A;
      --gold-dark:  #8B6914;
      --purple:     #4A2D6B;
      --purple-mid: #7B4FA8;
      --purple-light:#C9A8E8;
      --cream:      #F9F3E8;
      --marble:     #EDE8E0;
      --stone:      #D4CBBA;
      --ink:        #2C1E10;
      --ink-light:  #5C4030;
    }

    body {
      font-family: 'Crimson Text', Georgia, serif;
      background-color: var(--cream);
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(180,160,120,0.12) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(180,160,120,0.08) 40px);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ── */
    header {
      width: 100%;
      background: var(--purple);
      border-bottom: 4px solid var(--gold);
      padding: 2.5rem 1.5rem 2rem;
      text-align: center;
      position: relative;
    }
    header::before, header::after {
      content: '✦';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.4rem;
      color: var(--gold);
      opacity: 0.6;
    }
    header::before { left: 2rem; }
    header::after  { right: 2rem; }

    .site-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      font-weight: 700;
      color: var(--gold-light);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.15;
    }
    .site-subtitle {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.75rem, 1.8vw, 1rem);
      color: var(--purple-light);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 0.4rem;
    }

    /* ── Divider ornament ── */
    .ornament {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 100%;
      max-width: 680px;
      margin: 2rem auto 0;
      padding: 0 1.5rem;
    }
    .ornament-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-dark), transparent);
    }
    .ornament-icon { color: var(--gold); font-size: 1.1rem; }

    /* ── Main card ── */
    main {
      width: 100%;
      max-width: 680px;
      padding: 0 1.5rem 4rem;
      margin-top: 2rem;
    }

    .calculator-card {
      background: var(--marble);
      border: 1.5px solid var(--stone);
      border-radius: 2px;
      padding: 2.5rem 2rem;
      position: relative;
    }
    .calculator-card::before {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(180,150,80,0.25);
      border-radius: 1px;
      pointer-events: none;
    }

    /* ── Form labels ── */
    .field-group { margin-bottom: 1.8rem; }

    label.field-label {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-dark);
      margin-bottom: 0.5rem;
    }

    input[type="number"], select {
      width: 100%;
      padding: 0.75rem 1rem;
      font-family: 'Crimson Text', serif;
      font-size: 1.15rem;
      color: var(--ink);
      background: var(--cream);
      border: 1px solid var(--stone);
      border-radius: 2px;
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }
    input[type="number"]:focus, select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(201,168,76,0.18);
    }
    input[type="number"]::placeholder { color: var(--stone); }

    .select-wrapper { position: relative; }
    .select-wrapper::after {
      content: '▾';
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold-dark);
      pointer-events: none;
      font-size: 0.85rem;
    }

    /* ── Convert button ── */
    .btn-convert {
      width: 100%;
      padding: 0.85rem 1rem;
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--purple);
      background: var(--gold);
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 0.5rem;
    }
    .btn-convert:hover  { background: var(--gold-light); }
    .btn-convert:active { transform: scale(0.98); }

    /* ── Results grid ── */
    .results-section {
      margin-top: 2.5rem;
      display: none;
    }
    .results-section.visible { display: block; }

    .results-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .results-divider-line {
      flex: 1;
      height: 1px;
      background: var(--stone);
    }
    .results-divider-text {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-light);
    }

    .coins-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .coin-card {
      background: var(--cream);
      border: 1px solid var(--stone);
      border-top: 3px solid var(--gold);
      border-radius: 2px;
      padding: 1rem 0.85rem 0.85rem;
      text-align: center;
    }
    .coin-card.highlight { border-top-color: var(--purple-mid); }

    .coin-symbol {
      font-size: 1.6rem;
      margin-bottom: 0.25rem;
      line-height: 1;
    }
    .coin-name {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-light);
      margin-bottom: 0.4rem;
    }
    .coin-value {
      font-size: 1.55rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.1;
    }
    .coin-latin {
      font-style: italic;
      font-size: 0.8rem;
      color: var(--ink-light);
      margin-top: 0.15rem;
    }

    /* ── Description block ── */
    .description-block {
      background: var(--purple);
      border-radius: 2px;
      padding: 1.5rem 1.75rem;
      color: var(--purple-light);
      line-height: 1.75;
      font-size: 1.05rem;
      margin-top: 0.5rem;
    }
    .description-block strong {
      color: var(--gold-light);
      font-weight: 600;
    }
    .description-era {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--purple-light);
      opacity: 0.7;
      margin-bottom: 0.6rem;
    }

    /* ── Footer ── */
    footer {
      width: 100%;
      text-align: center;
      padding: 1.5rem;
      border-top: 1px solid var(--stone);
      font-size: 0.85rem;
      color: var(--ink-light);
      font-style: italic;
    }
  </style>
</head>
<body>

<header>
  <div class="site-title">Roman Currency Calculator</div>
  <div class="site-subtitle">Pecunia Romana · Aestimatio Moderna</div>
</header>

<main>
  <div class="ornament">
    <div class="ornament-line"></div>
    <span class="ornament-icon">⚜</span>
    <div class="ornament-line"></div>
  </div>

  <div style="margin-top:1.5rem;" class="calculator-card">

    <!-- Dollar input -->
    <div class="field-group">
      <label class="field-label" for="usd-input">Amount in US Dollars (USD)</label>
      <input type="number" id="usd-input" min="0" step="0.01" placeholder="e.g. 100" />
    </div>

    <!-- Era selector -->
    <div class="field-group">
      <label class="field-label" for="era-select">Select a Roman Era</label>
      <div class="select-wrapper">
        <select id="era-select">
          <!-- Options are populated by JS from the ERAS config below -->
        </select>
      </div>
    </div>

    <button class="btn-convert" onclick="calculate()">
      ⚖ &nbsp; Convert to Roman Currency
    </button>

    <!-- Results -->
    <div class="results-section" id="results-section">

      <div class="results-divider" style="margin-top:2rem;">
        <div class="results-divider-line"></div>
        <div class="results-divider-text">Aestimatio</div>
        <div class="results-divider-line"></div>
      </div>

      <div class="coins-grid" id="coins-grid">
        <!-- filled by JS -->
      </div>

      <div class="description-block" id="description-block">
        <!-- filled by JS -->
      </div>

    </div>
  </div>
</main>

<script>
/* ================================================================
   ✏️  CONFIGURATION — EDIT ALL YOUR VALUES HERE
   ================================================================

   Each entry in ERAS controls one option in the dropdown.

   FIELDS:
     label           — text shown in the dropdown menu
     aureus_usd      — modern USD value of ONE gold aureus
                       (scholarly estimates; feel free to adjust)
     denarius_per_aureus      — how many silver denarii = 1 aureus
     sestertius_per_denarius  — how many bronze sesterces = 1 denarius
     as_per_sestertius        — how many copper asses = 1 sestertius
     description     — the paragraph shown at the bottom.
                       Use these exact placeholders anywhere you like:
                         {aureus}    → formatted aureus count
                         {denarius}  → formatted denarius count
                         {sestertius}→ formatted sestertius count
                         {as}        → formatted as count
                         {usd}       → the dollar amount entered
                       Wrap words in <strong>...</strong> for gold highlight.
   ================================================================ */

const ERAS = [
  {
    label: "Early Republic (509–264 BC)",
    aureus_usd: 500,
    denarius_per_aureus: 25,
    sestertius_per_denarius: 4,
    as_per_sestertius: 4,
    description: `During the <strong>Early Republic</strong>, Rome had not yet struck the aureus; silver and bronze dominated trade. Your $\{usd} would be roughly <strong>{denarius} denarii</strong> or <strong>{sestertius} sesterces</strong>. A modest soldier's daily wage was about 2 asses, and a loaf of bread cost 1–2 asses. With this sum you might have purchased enough grain to feed a family for weeks, hired a craftsman for several days, or acquired a fine bronze vessel at the market in the Forum Boarium.`
  },
  {
    label: "Late Republic (133–27 BC)",
    aureus_usd: 600,
    denarius_per_aureus: 25,
    sestertius_per_denarius: 4,
    as_per_sestertius: 4,
    description: `In the turbulent <strong>Late Republic</strong>, the economy was strained by civil war yet rich with Mediterranean trade. Your $\{usd} converts to approximately <strong>{aureus} aurei</strong>, <strong>{denarius} denarii</strong>, or <strong>{sestertius} sesterces</strong>. At this time, a skilled legionary earned 225 denarii per year. You could have rented a comfortable apartment in Rome for several months, dined lavishly at a thermopolium for weeks on end, or purchased a fine woolen toga from a reputable cloth merchant on the Via Sacra.`
  },
  {
    label: "Augustus & Early Empire (27 BC–68 AD)",
    aureus_usd: 700,
    denarius_per_aureus: 25,
    sestertius_per_denarius: 4,
    as_per_sestertius: 4,
    description: `The <strong>Augustan golden age</strong> brought stability and prosperity. The aureus was pure and trusted across the empire. Your $\{usd} equals about <strong>{aureus} aurei</strong> or <strong>{denarius} denarii</strong>. A common legionary's annual pay was around 225 denarii. With your equivalent sum you might have bought a quality slave in the Roman market, secured passage on a merchant vessel across the Mediterranean, or feasted at one of Rome's renowned popinae for many months.`
  },
  {
    label: "Height of Empire (96–180 AD)",
    aureus_usd: 750,
    denarius_per_aureus: 25,
    sestertius_per_denarius: 4,
    as_per_sestertius: 4,
    description: `Under the <strong>Five Good Emperors</strong>, the Roman Empire reached its greatest geographic extent. The economy was vibrant and trade routes stretched from Britain to Mesopotamia. Your $\{usd} is equivalent to roughly <strong>{aureus} aurei</strong>, <strong>{denarius} denarii</strong>, or <strong>{sestertius} sesterces</strong>. A legionary now earned 300 denarii per year. This amount might have paid for a craftsman's year of labor, a prime seat at the Colosseum's private events, or several months of premium bathhouse access in Pompeii.`
  },
  {
    label: "Crisis & Decline (235–284 AD)",
    aureus_usd: 400,
    denarius_per_aureus: 25,
    sestertius_per_denarius: 4,
    as_per_sestertius: 4,
    description: `The <strong>Crisis of the Third Century</strong> brought hyperinflation and debased coinage. Silver content in the denarius dropped dramatically. Your $\{usd}, now worth <strong>{aureus} aurei</strong> or <strong>{denarius} denarii</strong>, would not stretch as far as in earlier times. Prices soared due to currency debasement. Even so, this sum could still purchase a moderate stock of olive oil, hire a farm laborer for a season, or acquire simple iron tools for a small workshop struggling through uncertain times.`
  },
  {
    label: "Late Empire (284–476 AD)",
    aureus_usd: 350,
    denarius_per_aureus: 25,
    sestertius_per_denarius: 4,
    as_per_sestertius: 4,
    description: `By the <strong>Late Empire</strong>, Diocletian and Constantine reformed the currency — introducing the solidus in place of the aureus — but purchasing power had shifted dramatically. Your $\{usd} translates to roughly <strong>{aureus} solidi</strong> or <strong>{denarius} argentei</strong>. The Edict of Maximum Prices (301 AD) attempted to cap costs on hundreds of goods. With this sum, you might have purchased a pair of military boots, a measure of wine from a local vineyard, or paid a scribe for several days of lettering official documents.`
  }
];

/* ================================================================
   COIN DISPLAY CONFIG
   Emoji, Latin name, and display label for each denomination.
   You can swap the emoji symbols here if you prefer different icons.
   ================================================================ */
const COIN_DISPLAY = {
  aureus:     { emoji: '🟡', latin: 'Aureus',      label: 'Gold Aureus'  },
  denarius:   { emoji: '⚪', latin: 'Denarius',    label: 'Silver Denarius' },
  sestertius: { emoji: '🟤', latin: 'Sestertius',  label: 'Bronze Sestertius' },
  as:         { emoji: '🔵', latin: 'As',           label: 'Copper As'    }
};

/* ================================================================
   RUNTIME — no edits needed below this line
   ================================================================ */

function fmt(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(2).replace(/\.?0+$/, '') + 'M';
  if (n >= 1000)    return Math.round(n).toLocaleString();
  if (n < 1)        return n.toFixed(4);
  return n % 1 === 0 ? n.toLocaleString() : n.toFixed(2);
}

// Populate dropdown
const sel = document.getElementById('era-select');
ERAS.forEach((era, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = era.label;
  sel.appendChild(opt);
});

function calculate() {
  const usd = parseFloat(document.getElementById('usd-input').value);
  if (isNaN(usd) || usd < 0) {
    alert('Please enter a valid dollar amount.');
    return;
  }

  const era = ERAS[parseInt(sel.value)];

  // Compute denominations
  const aureus     = usd / era.aureus_usd;
  const denarius   = aureus * era.denarius_per_aureus;
  const sestertius = denarius * era.sestertius_per_denarius;
  const as         = sestertius * era.as_per_sestertius;

  // Build coins grid
  const grid = document.getElementById('coins-grid');
  grid.innerHTML = '';
  const coins = [
    { key: 'aureus',     val: aureus     },
    { key: 'denarius',   val: denarius   },
    { key: 'sestertius', val: sestertius },
    { key: 'as',         val: as         }
  ];
  coins.forEach(({ key, val }) => {
    const d = COIN_DISPLAY[key];
    grid.innerHTML += `
      <div class="coin-card ${key === 'aureus' ? 'highlight' : ''}">
        <div class="coin-symbol">${d.emoji}</div>
        <div class="coin-name">${d.label}</div>
        <div class="coin-value">${fmt(val)}</div>
        <div class="coin-latin">${d.latin}</div>
      </div>`;
  });

  // Build description
  const desc = era.description
    .replace(/\{aureus\}/g,     `<strong>${fmt(aureus)}</strong>`)
    .replace(/\{denarius\}/g,   `<strong>${fmt(denarius)}</strong>`)
    .replace(/\{sestertius\}/g, `<strong>${fmt(sestertius)}</strong>`)
    .replace(/\{as\}/g,         `<strong>${fmt(as)}</strong>`)
    .replace(/\{usd\}/g,        `$${usd.toLocaleString()}`);

  document.getElementById('description-block').innerHTML = `
    <div class="description-era">${era.label}</div>
    ${desc}`;

  document.getElementById('results-section').classList.add('visible');
}

// Allow pressing Enter to calculate
document.getElementById('usd-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') calculate();
});
</script>
</body>
</html>
